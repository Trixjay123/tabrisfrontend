<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale="1.0" />
<meta charset="utf-8"/>
<link rel="stylesheet" type="text/css" href="imageHoster.css">
<title>Image Hoster</title>
<style>
    .background {
        background-color: #000000;
        height: 600px;
        max-height: 800px;
        width: 600px;
        max-width: 800px;
    }

    .fileButton {
        position: absolute;
        background: linear-gradient(135deg, #a044ff, #ff7a1a);
        height: 100px;
        width: 140px;
        border-radius: 8px;
        margin-top: 30px;
        left: 850px;
        align-items: center;
        justify-content: center;
    }

    .banner {
        width: 100%;
        height: 150px;
        position: absolute;
        align-items: center;
        background: linear-gradient(120deg red);
    }
    .fileButton label {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        height: 100%;
        width: 100%;
        text-align: center;
        cursor: pointer;
    }
</style>
</head>
<body class="background">
    <div class="banner">
        <div class="fileButton">
        <input type="file" id="fileGrab" accept="image/jpg, image/jpeg, image/png" hidden>
        <label for="fileGrab" class="custom-btn">Drop a file here <br>or <br>Browse</label>
        </div>
    </div>
<script>
    document.getElementById('fileGrab').addEventListener('change', async function (){
        
    }

)
    
</script>
</body>
</html>

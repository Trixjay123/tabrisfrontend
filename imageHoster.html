<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="utf-8"/>
  <title>Image Hoster</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .background {
      width: 100%;
      max-width: 650px;
    }

    .banner {
      padding: 20px;
    }

    .fileButton {
      width: 100%;
      height: 240px;
      border-radius: 16px;
      background: linear-gradient(135deg, #fc4ff3, rgb(250, 128, 13));
      box-shadow: 0 10px 25px rgba(252, 79, 243, 0.35),
                  0 10px 25px rgba(250, 128, 13, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fileButton label {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      gap: 18px;
      padding: 20px;
    }


    .urlBox {
      margin-top: 20px;
      width: 100%;
      min-height: 65px;
      border-radius: 12px;
      background: #1a1a1a;
      border: 3px solid #fc4ff3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      color: rgb(192, 191, 191);
      text-align: center;
      overflow-x: auto;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .fileButton {
        height: 210px;
      }

      .fileButton label {
        font-size: 1rem;
      }
    }
  .urlRow {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    }

  .copyButton {
    width: 36px;
    height: 36px;
    cursor: pointer;
    flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="background">
    <div class="banner">
      <div class="fileButton">
        <input type="file" id="fileGrab" accept="image/jpg, image/jpeg, image/png" hidden>
        <label for="fileGrab">
          <span>Select an Image <br>or <br> Browse</span>
        </label>
      </div>
    </div>
<div class="urlRow">
  <div class="urlBox">
    <p>Your URL will appear here...</p>
  </div>
  <img src="copyUrlButtonIcon.png" id="copyButton" class="copyButton">
</div>
    </div>

  </div>
</body>
</html>
  <script>
    window.onload = function () {
    const copyButton = document.getElementById('copyButton');
      copyButton.addEventListener("click", async function () {
      const urlDisplayText = document.getElementById('urlBox').innerText;
      await navigator.clipboard.writeText(urlDisplayText); })

    document.getElementById('fileGrab').addEventListener("change", async function () {
    // const imgReader =  new FileReader();
// the this.files keyword works as document.getElementById('fileGrab') since the referred to element has already been defined and therefore adding document.getElement Id on line62 would be redundant.
    const imgData = this.files[0];
    if (!imgData) return;
    const backEndReceiver = await fetch ( 'https://vids-das-advisor-newly.trycloudflare.com/', {
      method: 'POST',
      headers: {
        'Content-Type': imgData.type },
      body: imgData
      })
    const imgURL = await backEndReceiver.text()
    // acts as the method of replacing the urlBox placeholder with the URL that the backend generates.
    document.getElementById('urlBox').innerText = imgURL;

    // copy button event listener to ensure the button is capable of copying whatever is inside the urlBox element.

      } 
    )
    }

</body>

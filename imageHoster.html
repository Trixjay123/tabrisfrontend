<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale="1.0" />
<meta charset="utf-8"/>
<link rel="stylesheet" type="text/css" href="imageHoster.css">
<title>Image Hosting Site</title>
<style>
    .background {
        background-color: #0000;
        height: 1000px;
        width: 800px;
    }

    .fileButton {
        position: relative;
        background-color: rgb(207, 40, 223);
        height: 80px;
        width: 120px;
        border-radius: 10px;
    }

    .banner {
        width: 100%;
        height: 150px;
        position: absolute;
        align-items: center;
        background: linear-gradient(120deg red);
    }
</style>
</head>
<body class="background">
    <div class="banner">
        <div class="fileButton">
        <input type="file" id="fileGrab" hidden>
        <label for="fileGrab" class="custom-btn">Open File Here</label>
        </div>
    </div>
<script>
    document.getElementById('fileGrab').addEventListener('change', async function () {
        const file = this.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('http://26.81.94.252/upload', {
                method: 'POST',
                body: formData,
            });
            if (!response.ok) throw new Error(`Server error: ${response.status}`);

            const result = await response.json();
            console.log('Upload successful:', result);
        } catch (err) {
            console.error('Upload failed:', err);
        }
    });
</script>
</body>
</html>
